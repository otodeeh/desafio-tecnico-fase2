apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diagnosis-api
  template:
    metadata:
      labels:
        app: diagnosis-api
    spec:
      containers:
        - name: api
          image: diagnosis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_ARTIFACT
              value: /app/artifacts/models/logistic_regression_best.joblib
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: diagnosis-api-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
